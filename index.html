<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محمد أبوبكر | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card: #1a1a26;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #7070a0;
      --font-ar: 'Almarai', sans-serif;
      --font-en: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ar);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
      transition: all 0.3s ease;
    }

    body::before {
      content: '';
      position: fixed;
      top: -10%; right: -10%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(108,99,255,0.1) 0%, transparent 70%);
      z-index: -1;
    }

    .lang-switcher {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(108,99,255,0.2);
      backdrop-filter: blur(10px);
      color: white;
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font-en);
      font-weight: bold;
      transition: 0.3s;
    }
    .lang-switcher:hover { background: var(--accent); }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 30px rgba(108,99,255,0.3);
      padding: 4px;
    }

    .avatar img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg);
    }

    .hero-name {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 50%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub { font-size: 1.1rem; color: var(--muted); margin-bottom: 2.5rem; }
    .hero-sub span { color: var(--accent3); font-weight: 700; }

    /* رجعتلك الـ Style القديم للزراير هنا */
    .social-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 50px; /* الشكل الدائري Capsule */
      border: 1px solid rgba(108,99,255,0.3);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      background: rgba(108,99,255,0.05);
    }

    .social-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(108,99,255,0.3);
      color: white;
    }

    section { padding: 5rem 1.5rem; max-width: 900px; margin: 0 auto; }
    .section-title { 
      font-size: 2rem; font-weight: 800; margin-bottom: 2rem; color: #fff; 
      border-right: 5px solid var(--accent); padding-right: 15px; 
    }
    
    html[dir="ltr"] .section-title { border-right: none; border-left: 5px solid var(--accent); padding-right: 0; padding-left: 15px; }
    html[dir="ltr"] body { font-family: var(--font-en); }

    .about-text { font-size: 1.15rem; line-height: 1.9; color: var(--muted); text-align: justify; }

    .interests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
    .interest-card {
      background: var(--card); border-radius: 20px; padding: 1.5rem;
      border: 1px solid rgba(255,255,255,0.03); transition: 0.3s;
    }
    .interest-card:hover { border-color: var(--accent); transform: translateY(-5px); }

    .skills-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill-tag { 
      padding: 8px 18px; border-radius: 50px; 
      background: rgba(108,99,255,0.1); border: 1px solid var(--accent); 
      color: var(--accent); font-weight: 700;
    }

    footer { text-align: center; padding: 4rem; color: var(--muted); border-top: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <button class="lang-switcher" onclick="toggleLanguage()" id="lang-btn">English</button>

  <header class="hero">
    <div class="avatar"><img src="٢٠٢٥١٠١٨_١٥١٩٠٦.jpg" alt="محمد"></div>
    <p class="hero-tag" data-key="welcome">مرحباً بك في صفحتي</p>
